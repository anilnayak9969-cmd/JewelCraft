spring.application.name=JewelCraft
server.port=${PORT:8080}

# Database (override with env vars in production)
# =============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/JewelCraft?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# hibernate related setting
# =============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Lazy relations are loaded inside service transactions only
spring.jpa.open-in-view=false
# Load lazy relations in batches instead of one query per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50


# ===================================

#User defined propertities;
spring.app.jwtSecret=${JWT_SECRET:qwertyasdfghzxcvbnryuicvbnmwesrtdfyguisdfgfhZxcvbnsdfghsdfgewrtysxcvwertyuidfghb}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:604800000}

# Comma separated frontend URLs (patterns allowed) that may call the API.
# Default: any local port, so it keeps working if Vite moves from 5173 to 5174.
# In production set CORS_ORIGINS to the real site, e.g. https://jewelcraft.example
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Product image uploads are stored on disk here and served at /uploads/**
app.upload.dir=${UPLOAD_DIR:uploads}

# Checkout: delivery is free when the order (after coupon) reaches this amount
app.delivery.charge=99
app.delivery.free-above=5000

# Creates roles, demo users, categories, metal rates and sample products on first start
app.seed.demo-data=${SEED_DEMO_DATA:true}

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


